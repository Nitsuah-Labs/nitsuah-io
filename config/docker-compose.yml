services:
  app:
    # Must match .nvmrc exactly - enforced by `npm run check:node-lockstep`.
    image: node:26.10.0-slim
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --webpack"

volumes:
  node_modules:

name: CI Fast

on:
  push:
    branches: [main, dev, phase-3]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # Allow manual trigger from GitHub UI / gh CLI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Primary leg: the exact Node pinned in .nvmrc, which Docker, Netlify
          # and the husky hooks also use (see scripts/check-node-lockstep.js).
          - label: .nvmrc
            node-version: ""
            primary: true
          # Temporary soak leg while the Node 26 move is being kicked around:
          # the same suite on the previous major, so a red .nvmrc / green 22.x
          # split points straight at a Node regression. Drop once 26 is settled.
          - label: 22.x
            node-version: "22.x" # node-lockstep: baseline
            primary: false
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js (${{ matrix.label }})
        uses: actions/setup-node@v4
        with:
          # An empty node-version falls through to node-version-file.
          node-version: ${{ matrix.node-version }}
          node-version-file: .nvmrc
          cache: "npm"

      - name: Report Node/npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Generate wagmi hooks
        run: |
          if [ -n "$ETHERSCAN_API_KEY" ] || [ -n "$NEXT_PUBLIC_ALCHEMY_API_KEY" ]; then
            npm run wagmi
          else
            echo "Skipping wagmi generation - no API keys available"
            echo "This is expected in CI without secrets configured"
          fi
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}
        continue-on-error: true

      - name: Run validation (typecheck + format)
        run: npm run validate

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Jest tests
        run: npm test

      - name: Check Playwright Docker/npm version lockstep
        run: npm run check:playwright-lockstep

      - name: Check Node version lockstep (.nvmrc vs Docker/CI/Netlify/hooks)
        run: npm run check:node-lockstep

      - name: Build application
        id: build
        run: npx next build
        env:
          NEXT_PUBLIC_TEST_HELPERS: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.primary && steps.build.outcome == 'success'
        with:
          name: build-files
          path: |
            .next/
            !.next/cache
          retention-days: 1
          if-no-files-found: warn

  lighthouse-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    # Run on PRs, but continue even if build-and-test had issues (we'll rebuild if needed)
    if: github.event_name == 'pull_request' && !cancelled()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-files
          path: .next/

      - name: Rebuild if artifact missing
        if: steps.download-artifact.outcome != 'success'
        run: |
          echo "Build artifact not found, rebuilding..."
          npx next build

      - name: Start application
        run: npm start &

      - name: Wait for application to start
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        continue-on-error: true

  security-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

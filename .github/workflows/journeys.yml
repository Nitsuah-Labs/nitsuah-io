name: Journeys

# Nightly "AI user" journeys (tests/journeys). Failures become deduplicated
# `bot:journey` issues with no AI involved. Contract:
# https://github.com/nitsuah/.github/blob/main/journeys/STANDARD.md
#
# Replaces the artifact-only playwright-nightly.yml. Both KIT_SHA uses below
# (workflow ref and kit-ref) must stay the same nitsuah/.github commit; bump
# them together.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC, where playwright-nightly.yml used to run
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/journeys/**'
      - 'tests/visual/fixture.js'
      - 'config/playwright.journeys.config.ts'
      - '.github/workflows/journeys.yml'

permissions: {}

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run repo code (npm ci, the journeys) and the shared workflow
  # only prints a summary there, so they get a read-only token.
  journeys-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    uses: nitsuah/.github/.github/workflows/journeys.yml@24e08b791b2e14546baaa6971cc26a9b1cec7c15
    with:
      # Keep in step with @playwright/test in package.json and the image in
      # config/Dockerfile.test (noble: the baselines are drawn there).
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: 24e08b791b2e14546baaa6971cc26a9b1cec7c15
      repro: |
        docker compose -f config/docker-compose.test.yml run --rm \
          playwright npx playwright test --config config/playwright.journeys.config.ts

  # Nightly and manual runs file and close bot:journey issues and update the
  # bot/journeys branch (BUGS.md, metrics, failure screenshots).
  journeys:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # bot/journeys branch only
      issues: write
    uses: nitsuah/.github/.github/workflows/journeys.yml@24e08b791b2e14546baaa6971cc26a9b1cec7c15
    with:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: 24e08b791b2e14546baaa6971cc26a9b1cec7c15
      repro: |
        docker compose -f config/docker-compose.test.yml run --rm \
          playwright npx playwright test --config config/playwright.journeys.config.ts

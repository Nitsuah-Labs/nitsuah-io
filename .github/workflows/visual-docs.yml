name: Visual docs

# Regenerates docs/screenshots/*.png (tests/visual, one PNG per page of the
# site) and renders docs/diagrams/*.mmd to .svg, then opens or updates a PR on
# bot/visual-docs. Never pushes to main. Recipe: nitsuah/vigil
# docs/VISUAL_DOCS.md; promo/spots.json links the images by feature id.
#
# The screenshots are drawn in config/Dockerfile.test (the Playwright image
# pinned in lockstep with @playwright/test), exactly as `npm run
# test:e2e:docker:build` builds it, so CI and a local regeneration produce the
# same pixels.
#
# One-time repo setting: Settings -> Actions -> General -> "Allow GitHub
# Actions to create and approve pull requests".

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/visual/**'
      - 'config/playwright.screenshots.config.ts'
      - 'config/Dockerfile.test'
      - 'docs/diagrams/*.mmd'
      - 'docs/diagrams/mermaid.config.json'
      - 'scripts/visual-docs-readme.mjs'
      - '.github/workflows/visual-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build the Playwright image
        run: docker compose -f config/docker-compose.test.yml build

      - name: Capture screenshots
        run: >-
          docker compose -f config/docker-compose.test.yml run --rm
          playwright npm run capture:screenshots

      - name: Take back ownership of generated files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" docs test-results playwright-report 2>/dev/null || true

      - name: Render diagrams
        run: |
          # ubuntu-latest ships Google Chrome; point mermaid-cli's Puppeteer at it.
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
            PUPPETEER="-p $RUNNER_TEMP/puppeteer.json"
          fi
          CONFIG=""; [ -f docs/diagrams/mermaid.config.json ] && CONFIG="-c docs/diagrams/mermaid.config.json"
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 $PUPPETEER $CONFIG -b white -i "$f" -o "${f%.mmd}.svg"
            echo >> "${f%.mmd}.svg"   # end-of-file-fixer
          done

      - name: Update README diagram block
        # Screenshots are listed by hand in the README (28 full-page images
        # would swamp it), so the generated block lists diagrams only.
        run: SCREENSHOTS_DIR=docs/.none node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            docs/screenshots/*.png
            README.md
          commit-message: 'docs: regenerate screenshots and diagrams'
          title: 'docs: regenerate screenshots and diagrams'
          body: |
            Regenerated from tests/visual and docs/diagrams by `.github/workflows/visual-docs.yml` after ${{ github.sha }}.
            Review the images, then merge. No code changes.

name: Sync Resume Gist

# Keeps gist 086f7d1de6a5fd534ac4ccce226ac1d2 (nitsuah/resume.json) in sync
# with src/data/resume.json — the source of truth for /resume.

on:
  push:
    branches: [main]
    paths:
      - "src/data/resume.json"
      - ".github/workflows/sync-resume-gist.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-resume-gist
  cancel-in-progress: true

jobs:
  sync:
    name: Sync resume.json to gist
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 086f7d1de6a5fd534ac4ccce226ac1d2
          RESUME_FILE: src/data/resume.json
        run: |
          set -euo pipefail

          if [ -z "${GIST_TOKEN}" ]; then
            echo "GIST_TOKEN secret is not configured; skipping gist sync."
            echo "Add a repo secret named GIST_TOKEN (gist write access) to enable this workflow."
            exit 0
          fi

          if [ ! -f "${RESUME_FILE}" ]; then
            echo "::error::Missing ${RESUME_FILE}"
            exit 1
          fi

          # Build the PATCH body with jq so resume JSON is embedded safely
          # (no shell-escaping pitfalls for quotes/newlines).
          payload="$(jq -n --rawfile content "${RESUME_FILE}" \
            '{files: {"resume.json": {content: $content}}}')"

          http_code="$(curl -sS -o /tmp/gist-response.json -w '%{http_code}' \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "${payload}")"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Gist update failed with HTTP ${http_code}"
            cat /tmp/gist-response.json
            exit 1
          fi

          echo "Updated gist ${GIST_ID} file resume.json from ${RESUME_FILE} (HTTP ${http_code})."

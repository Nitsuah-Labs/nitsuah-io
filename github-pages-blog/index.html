  <style>
    /* 16-bit Retro CSS */
    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 4px; }
    }
    ::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
      animation: scanline 0.1s linear infinite; opacity: 0.6;
    }
    ::after {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 9998;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    }

    * { font-family: 'VT323', 'Press Start 2P', monospace !important; box-sizing: border-box; }
    code, pre { font-family: 'JetBrains Mono', 'Fira Code', monospace !important; font-size: 0.85rem !important; }

    html, body { margin: 0; padding: 0; background: #0d1117 !important; color: #c9d1d9 !important; min-height: 100vh; }

    /* Header bar */
    .homebar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #161b22; border-bottom: 2px solid #30363d;
      padding: 0.75rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .homebar-title { font-family: 'VT323', monospace; font-size: 1.5rem; color: #58a6ff; text-shadow: 0 0 10px #58a6ff; letter-spacing: 0.05em; text-decoration: none; }
    .homebar-nav { display: flex; gap: 1rem; }
    .homebar-link { color: #f97316; text-decoration: none; padding: 0.5rem 1rem; border: 2px solid transparent; border-radius: 0; transition: all 0.1s; }
    .homebar-link:hover { border-color: #f97316; background: rgba(249, 115, 22, 0.1); transform: translateY(-2px); }

    /* Main content */
    main { padding-top: 80px; padding-bottom: 4rem; max-width: 1400px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem; }

    /* Page header */
    .page-header { margin-bottom: 3rem; text-align: center; }
    .page-header h1 {
      font-size: 3rem; font-weight: normal; margin: 0 0 1rem 0;
      background: linear-gradient(135deg, #58a6ff 0%, #f97316 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    .page-header .subtitle { color: #8b949e; font-size: 1.2rem; font-family: 'VT323', monospace; }

    /* Blog grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    /* Blog card */
    .blog-card {
      background: #161b22; border: 2px solid #30363d;
      padding: 1.5rem; text-decoration: none; color: inherit;
      transition: all 0.15s; display: flex; flex-direction: column; height: 100%;
    }
    .blog-card:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 16px #58a6ff, 0 0 32px #58a6ff44;
      transform: translateY(-4px);
    }
    .blog-card .card-meta { display: flex; gap: 1rem; margin-bottom: 0.75rem; font-size: 0.75rem; color: #8b949e; flex-wrap: wrap; }
    .blog-card .card-tag { background: #30363d; padding: 0.2rem 0.5rem; border: 1px solid #58a6ff; color: #58a6ff; }
    .blog-card .card-category { color: #f97316; }
    .blog-card .card-date { color: #6e7681; }
    .blog-card h2 { font-size: 1.4rem; font-weight: normal; margin: 0 0 0.75rem 0; color: #c9d1d9; line-height: 1.3; }
    .blog-card .card-excerpt { font-size: 0.9rem; color: #8b949e; line-height: 1.5; flex-grow: 1; margin-bottom: 1rem; }
    .blog-card .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid #30363d; font-size: 0.8rem; color: #6e7681; }
    .blog-card .card-read-time { color: #58a6ff; }
    .blog-card .card-arrow { color: #f97316; opacity: 0; transition: opacity 0.1s; }
    .blog-card:hover .card-arrow { opacity: 1; }

    /* Footer */
    .site-footer { text-align: center; padding: 3rem 2rem; border-top: 2px solid #30363d; margin-top: 4rem; color: #6e7681; font-size: 0.9rem; }
    .site-footer a { color: #58a6ff; text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }

    /* Loading animation for cards */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .blog-card { animation: cardFadeIn 0.4s ease-out forwards; opacity: 0; }
    .blog-card:nth-child(1) { animation-delay: 0.1s; }
    .blog-card:nth-child(2) { animation-delay: 0.2s; }
    .blog-card:nth-child(3) { animation-delay: 0.3s; }
    .blog-card:nth-child(4) { animation-delay: 0.4s; }
    .blog-card:nth-child(5) { animation-delay: 0.5s; }
    .blog-card:nth-child(6) { animation-delay: 0.6s; }
    .blog-card:nth-child(7) { animation-delay: 0.7s; }
    .blog-card:nth-child(8) { animation-delay: 0.8s; }
    .blog-card:nth-child(9) { animation-delay: 0.9s; }
    .blog-card:nth-child(10) { animation-delay: 1.0s; }
    .blog-card:nth-child(11) { animation-delay: 1.1s; }
  </style>
</head>
